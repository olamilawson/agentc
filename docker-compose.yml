# Foundation deployment on the Hostinger VPS (KVM 2).
# n8n already runs on this host and stays as-is; it keeps only the mailbox watcher.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env on the server}
      POSTGRES_DB: personal_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]   # never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      PERSONAL_AGENT_DATABASE_URL: postgresql+psycopg://personal_agent:${POSTGRES_PASSWORD}@postgres:5432/personal_agent
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Minutes an approved agency brief is held before it is sent. Empty: 15.
      PERSONAL_AGENT_DISPATCH_HOLD_MINUTES: ${PERSONAL_AGENT_DISPATCH_HOLD_MINUTES:-}
      # Connectors (src/personal_agent/connectors.py). Empty: not connected.
      CANVA_CLIENT_ID: ${CANVA_CLIENT_ID:-}
      CANVA_CLIENT_SECRET: ${CANVA_CLIENT_SECRET:-}
      HIGGSFIELD_API_KEY_ID: ${HIGGSFIELD_API_KEY_ID:-}
      HIGGSFIELD_API_KEY_SECRET: ${HIGGSFIELD_API_KEY_SECRET:-}
      # Cal.com bookings (deploy/calcom.md): the API key answers bookings; the secret checks Cal.com's webhook.
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-}
      # Where Canva sends you back after you sign in to it.
      PERSONAL_AGENT_PUBLIC_URL: ${PERSONAL_AGENT_PUBLIC_URL:-https://ijeoma.pro}
      # Set by ./deploy/setup.sh --local-model once Ollama runs on this server.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-}
      PERSONAL_AGENT_N8N_SECRET: ${PERSONAL_AGENT_N8N_SECRET:-}
      PERSONAL_AGENT_NAME: ${PERSONAL_AGENT_NAME:-Chidimma OS}
      PERSONAL_AGENT_OWNER_NAME: ${PERSONAL_AGENT_OWNER_NAME:-Chidimma}
      # Microsoft Graph mail. All four set: approved replies go out through the
      # mailbox. Any empty: they are held in the local outbox (deploy/microsoft-graph.md).
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID:-}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID:-}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET:-}
      MS_GRAPH_MAILBOX: ${MS_GRAPH_MAILBOX:-}
      MS_GRAPH_CALENDAR: ${MS_GRAPH_CALENDAR:-}
      # Owner sign-in: email and password. On this server the app refuses every
      # request until the email, hash and session secret are set (deploy/setup.sh
      # creates them). A TOTP secret adds a one-time code; empty leaves it off.
      PERSONAL_AGENT_REQUIRE_LOGIN: "1"
      PERSONAL_AGENT_OWNER_EMAIL: ${PERSONAL_AGENT_OWNER_EMAIL:-}
      PERSONAL_AGENT_OWNER_PASSWORD_HASH: ${PERSONAL_AGENT_OWNER_PASSWORD_HASH:-}
      PERSONAL_AGENT_TOTP_SECRET: ${PERSONAL_AGENT_TOTP_SECRET:-}
      PERSONAL_AGENT_SESSION_SECRET: ${PERSONAL_AGENT_SESSION_SECRET:-}
    volumes:
      # Client folders (the image points them at /app/data). A host directory,
      # so deploy/backup.sh picks it up. Checkpoints are in Postgres.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    # Reachable from this server only, never from the internet. The server's own
    # web server (nginx on this VPS) passes ijeoma.pro to it; see
    # deploy/nginx-ijeoma.pro.conf.
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"

  # Open-weight models on this server, for routine steps. Off unless asked for:
  # ./deploy/setup.sh --local-model qwen2.5:3b starts it and fetches the model.
  # Never published to the host, and held to a share of the machine so the other
  # sites on this server keep theirs.
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    mem_limit: 4g
    cpus: 1.5

  # Caddy is for a server with nothing else on ports 80 and 443. This VPS serves
  # several domains through its own nginx, so Caddy stays off: it starts only
  # with `docker compose --profile caddy up -d`.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:-}
      AGENT_ADMIN_EMAIL: ${AGENT_ADMIN_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  ollama:
  caddy_data:
  caddy_config:

networks:
  internal:
