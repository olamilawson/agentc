# nginx site for ijeoma.pro: passes this one domain to the agent on 127.0.0.1:8100.
# It names only ijeoma.pro and www.ijeoma.pro, so no other site on the server is touched.
#
# Install (Debian/Ubuntu layout):
#   cp /opt/personal-agent/deploy/nginx-ijeoma.pro.conf /etc/nginx/sites-available/ijeoma.pro
#   ln -s /etc/nginx/sites-available/ijeoma.pro /etc/nginx/sites-enabled/ijeoma.pro
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ijeoma.pro -d www.ijeoma.pro     # adds the certificate and the HTTPS redirect

server {
    listen 80;
    listen [::]:80;
    server_name ijeoma.pro www.ijeoma.pro;

    # File intake accepts up to 20 MB.
    client_max_body_size 25m;

    # A private workspace: keep it out of search engines, and let it load nothing from other hosts.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        # The app checks that a change comes from its own site, so it needs the real host name.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run works through its model calls inside the request, which can take minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
