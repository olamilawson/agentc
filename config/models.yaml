# The models offered on the Settings and cost screen, for each tier's route.
#
# id    what LiteLLM is asked for: provider/model
# key   the setting the server needs before the model can answer
# open  true for an open-weight model
#
# Nothing here is checked against a provider's current list. The screen's
# "Test this model" button makes one small call and reports what came back; use
# it before you route a tier to a model. Any other id can be typed on the screen.
models:
  - {id: openai/gpt-5, label: "GPT-5", key: OPENAI_API_KEY}
  - {id: openai/gpt-5-mini, label: "GPT-5 mini", key: OPENAI_API_KEY}
  - {id: openai/gpt-5-nano, label: "GPT-5 nano", key: OPENAI_API_KEY}
  - {id: anthropic/claude-opus-5-5, label: "Claude Opus 5.5", key: ANTHROPIC_API_KEY}
  - {id: anthropic/claude-sonnet-5-5, label: "Claude Sonnet 5.5", key: ANTHROPIC_API_KEY}
  - {id: anthropic/claude-haiku-5-5, label: "Claude Haiku 5.5", key: ANTHROPIC_API_KEY}

  # Open-weight, run on this server by Ollama. No fee for each call and the text
  # stays on the server. Small models on a CPU: slow, and suited to routine steps.
  # Start one with: ./deploy/setup.sh --local-model qwen2.5:3b
  - {id: "ollama_chat/qwen2.5:3b", label: "Qwen 2.5 3B, on this server", key: OLLAMA_API_BASE, open: true}
  - {id: "ollama_chat/llama3.2:3b", label: "Llama 3.2 3B, on this server", key: OLLAMA_API_BASE, open: true}

  # Open-weight, hosted by someone else. Larger and faster than this server can
  # run. The text goes to that host, under its terms and its free-use limits.
  - {id: groq/llama-3.3-70b-versatile, label: "Llama 3.3 70B, hosted by Groq", key: GROQ_API_KEY, open: true}
  - {id: groq/openai/gpt-oss-120b, label: "gpt-oss 120B, hosted by Groq", key: GROQ_API_KEY, open: true}
  - {id: groq/meta-llama/llama-4-scout-17b-16e-instruct, label: "Llama 4 Scout, reads images, hosted by Groq", key: GROQ_API_KEY, open: true}
  - {id: "openrouter/meta-llama/llama-3.3-70b-instruct:free", label: "Llama 3.3 70B, hosted through OpenRouter", key: OPENROUTER_API_KEY, open: true}
