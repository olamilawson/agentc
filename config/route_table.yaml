# Model route table — tiers map to providers; changing a model never changes code.
#
# All three tiers point at OpenAI for now (owner's instruction, 2026-10-11): the
# OpenAI key is the first to arrive. The model names are the ones this file
# already carried and have not been checked against the account's model list;
# confirm them once the key is in (PRD: model routing and cost).
#
# No fallback is named yet. A fallback is used only on provider error, and one
# that points at a provider with no key would fail too and report its own
# error in place of the real one. Add `fallback:` lines when a second
# provider's key is on the server, for example:
#   fallback: anthropic/claude-sonnet-4-5
cheap:
  primary: openai/gpt-5-mini
standard:
  primary: openai/gpt-5
strong:
  primary: openai/gpt-5
