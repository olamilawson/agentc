# Model route table — tiers map to providers; changing a model never changes code.
#
# Every tier points at Groq for now (owner's instruction, 2026-10-13): its key is
# the one on the server that works. Groq hosts open-weight models; the text of
# each step goes to Groq under its terms, so keep restricted clients off it
# until Groq is listed in config/providers.yaml.
#
# The model names are from memory and have not been checked against the
# account. Use "Test this model" on the Settings and cost screen. A choice saved
# on that screen replaces the line here for its tier.
#
# No fallback is named. A fallback is used only on provider error, and one that
# points at a provider with no credit would fail too and report its own error
# in place of the real one. Add `fallback:` lines once a second provider works.
cheap:
  primary: groq/llama-3.3-70b-versatile
standard:
  primary: groq/llama-3.3-70b-versatile
strong:
  primary: groq/llama-3.3-70b-versatile
# Steps that show the model a picture (creative review, logo critique) use this
# route whatever their tier, because the model above reads text alone.
vision:
  primary: groq/meta-llama/llama-4-scout-17b-16e-instruct
