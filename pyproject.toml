[project]
name = "personal-agent"
version = "0.1.0"
description = "Single-owner, approval-gated agent — Foundation phase (approval queue + run record + test graph)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "litellm>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deploy = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
